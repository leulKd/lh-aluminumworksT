<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Project Gallery | LH Aluminum Works</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest" defer></script>
  <style>
    :root { --ink:#152033; --ink-2:#24324a; --blue:#0d6efd; --blue-dark:#0958c9; --mist:#eff3f7; --paper:#fff; --muted:#627286; --line:#dce4ec; }
    * { box-sizing:border-box; }
    html { scroll-behavior:smooth; }
    body { margin:0; background:var(--mist); color:var(--ink); font-family:Lato,Arial,sans-serif; }
    button { font:inherit; }
    .site-nav { height:72px; display:flex; align-items:center; justify-content:space-between; padding:0 clamp(20px,6vw,88px); background:rgba(21,32,51,.98); color:#fff; border-bottom:2px solid var(--blue); }
    .brand { display:flex; align-items:center; gap:11px; font-family:Rajdhani,sans-serif; font-weight:700; font-size:1.15rem; letter-spacing:1px; }
    .brand-mark { display:grid; width:44px; height:44px; flex:0 0 44px; place-items:center; overflow:hidden; border:1px solid #4f9dff; border-radius:50%; }
    .brand-mark img { display:block; width:100%; height:100%; object-fit:cover; }
    .back-link { display:inline-flex; gap:8px; align-items:center; padding:10px 14px; border-radius:6px; background:#fff; color:#0958c9; text-decoration:none; font:700 .92rem Rajdhani,sans-serif; letter-spacing:1px; text-transform:uppercase; box-shadow:0 4px 12px rgba(0,0,0,.16); }
    .back-link:hover { background:#67a8ff; color:#101b2d; }
    .hero { position:relative; overflow:hidden; padding:76px clamp(20px,8vw,128px) 68px; color:#fff; background:linear-gradient(112deg,#101b2d,#1e385d); }
    .hero::after { content:""; position:absolute; inset:0; opacity:.2; background-image:linear-gradient(90deg,transparent 49.5%,#9ac2ff 50%,transparent 50.5%),linear-gradient(0deg,transparent 49.5%,#9ac2ff 50%,transparent 50.5%); background-size:58px 58px; mask-image:linear-gradient(to left,black,transparent 70%); }
    .hero-inner { position:relative; z-index:1; max-width:850px; }
    .eyebrow { margin:0 0 13px; color:#67a8ff; font:600 .82rem Rajdhani,sans-serif; letter-spacing:3px; text-transform:uppercase; }
    h1 { margin:0; font:700 clamp(3rem,6vw,5rem)/.9 Rajdhani,sans-serif; letter-spacing:0; }
    .hero-copy { max-width:590px; margin:20px 0 0; color:#c5d1df; font-size:1.05rem; line-height:1.65; }
    .gallery-shell { max-width:1440px; padding:48px clamp(20px,6vw,88px) 80px; margin:auto; }
    .gallery-toolbar { display:flex; align-items:center; justify-content:space-between; gap:20px; margin-bottom:28px; }
    .gallery-count { color:var(--muted); font-size:.93rem; }
    .gallery-count strong { color:var(--ink); }
    .filters { display:flex; flex-wrap:wrap; gap:8px; }
    .filter { border:1px solid var(--line); border-radius:4px; background:#fff; color:#516174; cursor:pointer; padding:9px 14px; font:600 .85rem Rajdhani,sans-serif; letter-spacing:1px; text-transform:uppercase; transition:.2s ease; }
    .filter:hover,.filter[aria-pressed="true"] { border-color:var(--blue); background:var(--blue); color:#fff; }
    .gallery-grid { display:grid; grid-template-columns:repeat(12,1fr); grid-auto-rows:19px; gap:18px; }
    .project-card { position:relative; grid-column:span 4; grid-row:span 20; min-width:0; padding:0; border:0; overflow:hidden; background:var(--ink); cursor:zoom-in; text-align:left; opacity:0; transform:translateY(18px); transition:opacity .5s ease,transform .5s ease,box-shadow .25s ease; }
    .project-card.wide { grid-column:span 8; }
    .project-card.tall { grid-row:span 28; }
    .project-card.revealed { opacity:1; transform:translateY(0); }
    .project-card.is-hidden { display:none; }
    .project-card:focus-visible { outline:3px solid #72adff; outline-offset:3px; }
    .project-card:hover { box-shadow:0 18px 34px rgba(16,31,51,.24); z-index:1; }
    .project-card img { width:100%; height:100%; display:block; object-fit:cover; transition:transform .6s cubic-bezier(.2,.7,.25,1); }
    .project-card:hover img { transform:scale(1.07); }
    .project-card::after { content:""; position:absolute; inset:0; background:linear-gradient(to top,rgba(10,20,35,.88),rgba(10,20,35,0) 62%); opacity:.88; transition:opacity .25s ease; }
    .project-card:hover::after { opacity:1; }
    .card-copy { position:absolute; z-index:1; right:18px; bottom:17px; left:18px; color:#fff; transform:translateY(9px); transition:transform .25s ease; }
    .project-card:hover .card-copy { transform:none; }
    .tag { display:inline-block; margin-bottom:6px; color:#9cc6ff; font:600 .73rem Rajdhani,sans-serif; letter-spacing:1.7px; text-transform:uppercase; }
    .card-title { display:block; font:700 clamp(1.1rem,1.9vw,1.45rem)/1 Rajdhani,sans-serif; letter-spacing:.2px; }
    .expand { position:absolute; z-index:2; top:14px; right:14px; display:grid; width:34px; height:34px; place-items:center; border:1px solid rgba(255,255,255,.55); background:rgba(10,20,35,.35); color:#fff; opacity:0; transform:translateY(-5px); transition:.25s ease; }
    .project-card:hover .expand,.project-card:focus-visible .expand { opacity:1; transform:none; }
    .empty-state { display:none; padding:65px 20px; text-align:center; color:var(--muted); background:#fff; border:1px dashed var(--line); }
    .modal { position:fixed; z-index:20; inset:0; display:grid; place-items:center; visibility:hidden; opacity:0; padding:22px; background:rgba(7,13,24,.94); transition:opacity .25s ease,visibility .25s; }
    .modal.open { visibility:visible; opacity:1; }
    .modal-figure { width:min(1200px,100%); max-height:92vh; margin:0; display:grid; grid-template-columns:minmax(0,1fr) 300px; background:#101b2d; transform:scale(.97); transition:transform .25s ease; }
    .modal.open .modal-figure { transform:scale(1); }
    .modal-image-wrap { min-height:0; display:grid; place-items:center; background:#090f1a; }
    .modal-image { max-width:100%; max-height:83vh; display:block; object-fit:contain; }
    .modal-info { position:relative; display:flex; flex-direction:column; justify-content:flex-end; padding:32px 26px; color:#fff; }
    .modal-info p { margin:10px 0 0; color:#b8c5d5; font-size:.92rem; line-height:1.55; }
    .icon-button { position:absolute; display:grid; width:42px; height:42px; place-items:center; border:1px solid rgba(255,255,255,.36); background:rgba(16,27,45,.7); color:#fff; cursor:pointer; }
    .icon-button:hover { background:var(--blue); border-color:var(--blue); }
    .close { top:16px; right:16px; }
    .previous,.next { top:50%; transform:translateY(-50%); }
    .previous { left:24px; } .next { right:24px; }
    .status { position:absolute; bottom:17px; left:20px; color:#b8c5d5; font:600 .77rem Rajdhani,sans-serif; letter-spacing:1.3px; }
    @media (max-width:850px) { .gallery-grid { grid-auto-rows:16px; gap:13px; } .project-card { grid-column:span 6; } .project-card.wide { grid-column:span 12; } .modal-figure { grid-template-columns:1fr; } .modal-info { min-height:150px; } .modal-image { max-height:65vh; } .previous { left:10px; } .next { right:10px; } }
    @media (max-width:560px) { .site-nav { height:64px; } .brand { font-size:.95rem; } .gallery-toolbar { align-items:flex-start; flex-direction:column; } .gallery-grid { grid-auto-rows:13px; gap:10px; } .project-card,.project-card.wide { grid-column:span 12; grid-row:span 25; } .project-card.tall { grid-row:span 29; } .modal { padding:0; } .modal-figure { width:100%; max-height:100vh; } .modal-info { padding:24px; min-height:132px; } .close { top:12px; right:12px; } .previous,.next { top:33%; } }
    @media (prefers-reduced-motion:reduce) { *,*::before,*::after { scroll-behavior:auto!important; transition-duration:.01ms!important; animation-duration:.01ms!important; } }
  </style>
</head>
<body>
  <nav class="site-nav"><div class="brand"><span class="brand-mark"><img src="LH logo.jpg" alt="LH Aluminum logo"></span> ALUMINUM WORKS</div><a class="back-link" href="index.html"><i data-lucide="arrow-left" aria-hidden="true"></i> Back to site</a></nav>
  <header class="hero"><div class="hero-inner"><p class="eyebrow">Selected work</p><h1>Built for the details.</h1><p class="hero-copy">Explore our aluminum windows, doors, curtain walls, and glazing installations. Select any project for a closer look.</p></div></header>
  <main class="gallery-shell">
    <div class="gallery-toolbar"><div class="filters" aria-label="Filter projects">
      <button class="filter" data-filter="all" aria-pressed="true">All work</button><button class="filter" data-filter="government" aria-pressed="false">Government</button><button class="filter" data-filter="commercial" aria-pressed="false">Commercial</button><button class="filter" data-filter="residential" aria-pressed="false">Residential</button><button class="filter" data-filter="institutional" aria-pressed="false">Institutional</button>
    </div><p class="gallery-count"><strong id="project-count">15</strong> projects shown</p></div>
    <section class="gallery-grid" id="gallery-grid" aria-label="Project gallery">
      <button class="project-card wide tall" data-category="residential" data-title="Friendship Federal Housing" data-description="Complete aluminum window and balcony railing systems for a large-scale housing development."><img src="Freindship Federal Housing.jpg" alt="Friendship Federal Housing project"><span class="expand"><i data-lucide="maximize-2"></i></span><span class="card-copy"><span class="tag">Residential</span><span class="card-title">Friendship Federal Housing</span></span></button>
      <button class="project-card" data-category="government" data-title="Adama Ministry of Revenue" data-description="Aluminum curtain wall cladding and glazing for a prominent government tower in Adama."><img src="Adama Minister of revenue.jpg" alt="Adama Ministry of Revenue project"><span class="expand"><i data-lucide="maximize-2"></i></span><span class="card-copy"><span class="tag">Government</span><span class="card-title">Adama Ministry of Revenue</span></span></button>
      <button class="project-card" data-category="institutional" data-title="Dessie University" data-description="Aluminum window and door systems throughout a major university campus building."><img src="Dessie university.jpg" alt="Dessie University project"><span class="expand"><i data-lucide="maximize-2"></i></span><span class="card-copy"><span class="tag">Institutional</span><span class="card-title">Dessie University</span></span></button>
      <button class="project-card" data-category="government" data-title="Hawasa Ministry of Revenue" data-description="Modern aluminum curtain wall and glazing systems for the Ministry of Revenue building in Hawasa."><img src="Hawasa Ministire of revenue.jpg" alt="Hawasa Ministry of Revenue project"><span class="expand"><i data-lucide="maximize-2"></i></span><span class="card-copy"><span class="tag">Government</span><span class="card-title">Hawasa Ministry of Revenue</span></span></button>
      <button class="project-card wide" data-category="commercial" data-title="Tsenage Building" data-description="Reflective glass curtain wall installation for a multi-story commercial building."><img src="Tsenage building.jpg" alt="Tsenage Building project"><span class="expand"><i data-lucide="maximize-2"></i></span><span class="card-copy"><span class="tag">Commercial</span><span class="card-title">Tsenage Building</span></span></button>
      <button class="project-card wide" data-category="commercial" data-title="Tempered Glass Storefront" data-description="Tempered glass storefront installation for a commercial building entrance."><img src="tempered glass.jpg" alt="Tempered glass storefront installation"><span class="expand"><i data-lucide="maximize-2"></i></span><span class="card-copy"><span class="tag">Commercial</span><span class="card-title">Tempered Glass Storefront</span></span></button>
      <button class="project-card" data-category="commercial" data-title="Tempered Glass Installation" data-description="Commercial-grade tempered glass frontage installed with precise aluminum framing."><img src="tempered glass 2.jpg" alt="Tempered glass installation in progress"><span class="expand"><i data-lucide="maximize-2"></i></span><span class="card-copy"><span class="tag">Commercial</span><span class="card-title">Tempered Glass Installation</span></span></button>
      <button class="project-card tall" data-category="commercial" data-title="Tilahun Gutu Hotel — Before" data-description="Initial stage of the aluminum window and façade work for Tilahun Gutu Hotel in Ambo."><img src="ambo before.jpg" alt="Tilahun Gutu Hotel in Ambo before aluminum work"><span class="expand"><i data-lucide="maximize-2"></i></span><span class="card-copy"><span class="tag">Commercial</span><span class="card-title">Tilahun Gutu Hotel — Before</span></span></button>
      <button class="project-card" data-category="commercial" data-title="Tilahun Gutu Hotel — After" data-description="Completed aluminum window and façade installation for Tilahun Gutu Hotel in Ambo."><img src="ambo after.jpg" alt="Tilahun Gutu Hotel in Ambo after aluminum work"><span class="expand"><i data-lucide="maximize-2"></i></span><span class="card-copy"><span class="tag">Commercial</span><span class="card-title">Tilahun Gutu Hotel — After</span></span></button>
      <button class="project-card wide" data-category="institutional" data-title="University Building — East Wing" data-description="Aluminum window systems fitted across the east wing of a university building."><img src="university.jpg" alt="University building aluminum window project"><span class="expand"><i data-lucide="maximize-2"></i></span><span class="card-copy"><span class="tag">Institutional</span><span class="card-title">University Building — East Wing</span></span></button>
      <button class="project-card" data-category="institutional" data-title="University Building — Main Block" data-description="Durable aluminum windows and doors for a multi-level university project."><img src="university 2.jpg" alt="University main block project"><span class="expand"><i data-lucide="maximize-2"></i></span><span class="card-copy"><span class="tag">Institutional</span><span class="card-title">University Building — Main Block</span></span></button>
      <button class="project-card" data-category="commercial" data-title="Aluminum Profile Supply" data-description="Aluminum profiles prepared and supplied for fabrication and installation projects."><img src="profile.jpg" alt="Aluminum profile supply"><span class="expand"><i data-lucide="maximize-2"></i></span><span class="card-copy"><span class="tag">Commercial</span><span class="card-title">Aluminum Profile Supply</span></span></button>
      <button class="project-card tall" data-category="commercial" data-title="Contemporary Façade System" data-description="Modern aluminum and glass façade detailing for a commercial building."><img src="random.jpg" alt="Contemporary aluminum facade"><span class="expand"><i data-lucide="maximize-2"></i></span><span class="card-copy"><span class="tag">Commercial</span><span class="card-title">Contemporary Façade System</span></span></button>
      <button class="project-card" data-category="institutional" data-title="Dessie University Curtain Wall" data-description="Curtain wall installation underway at Dessie University."><img src="dessie university c.jpg" alt="Dessie University curtain wall installation"><span class="expand"><i data-lucide="maximize-2"></i></span><span class="card-copy"><span class="tag">Institutional</span><span class="card-title">Dessie University Curtain Wall</span></span></button>
      <button class="project-card wide" data-category="institutional" data-title="Dessie University Entrance Glazing" data-description="Glass entrance and aluminum glazing work for Dessie University."><img src="dessie university b.jpg" alt="Dessie University entrance glazing"><span class="expand"><i data-lucide="maximize-2"></i></span><span class="card-copy"><span class="tag">Institutional</span><span class="card-title">Dessie University Entrance Glazing</span></span></button>
    </section>
    <div class="empty-state" id="empty-state">No projects match this category.</div>
  </main>
  <div class="modal" id="modal" aria-hidden="true" role="dialog" aria-modal="true" aria-labelledby="modal-title"><button class="icon-button close" id="close-modal" aria-label="Close project view" title="Close"><i data-lucide="x"></i></button><button class="icon-button previous" id="previous" aria-label="Previous project" title="Previous project"><i data-lucide="chevron-left"></i></button><figure class="modal-figure"><div class="modal-image-wrap"><img class="modal-image" id="modal-image" alt=""></div><figcaption class="modal-info"><span class="tag" id="modal-category"></span><strong class="card-title" id="modal-title"></strong><p id="modal-description"></p></figcaption></figure><button class="icon-button next" id="next" aria-label="Next project" title="Next project"><i data-lucide="chevron-right"></i></button><span class="status" id="modal-status"></span></div>
  <script>
    const cards = [...document.querySelectorAll('.project-card')];
    const filters = [...document.querySelectorAll('.filter')];
    const modal = document.querySelector('#modal');
    const modalImage = document.querySelector('#modal-image');
    const modalTitle = document.querySelector('#modal-title');
    const modalCategory = document.querySelector('#modal-category');
    const modalDescription = document.querySelector('#modal-description');
    const modalStatus = document.querySelector('#modal-status');
    let visibleCards = cards, activeIndex = 0, lastTrigger;
    const observer = new IntersectionObserver(entries => entries.forEach(entry => { if (entry.isIntersecting) { entry.target.classList.add('revealed'); observer.unobserve(entry.target); } }), { threshold:.08 });
    cards.forEach((card, index) => { card.style.transitionDelay = `${(index % 4) * 65}ms`; observer.observe(card); card.addEventListener('click', () => openModal(card)); });
    function refreshIcons() { if (window.lucide) lucide.createIcons(); }
    function openModal(card) { lastTrigger = card; visibleCards = cards.filter(item => !item.classList.contains('is-hidden')); activeIndex = visibleCards.indexOf(card); updateModal(); modal.classList.add('open'); modal.setAttribute('aria-hidden','false'); document.body.style.overflow='hidden'; document.querySelector('#close-modal').focus(); }
    function updateModal() { const card = visibleCards[activeIndex]; const image = card.querySelector('img'); modalImage.src=image.currentSrc || image.src; modalImage.alt=image.alt; modalTitle.textContent=card.dataset.title; modalCategory.textContent=card.dataset.category; modalDescription.textContent=card.dataset.description; modalStatus.textContent=`${activeIndex + 1} / ${visibleCards.length}`; }
    function closeModal() { modal.classList.remove('open'); modal.setAttribute('aria-hidden','true'); document.body.style.overflow=''; if(lastTrigger) lastTrigger.focus(); }
    function move(step) { activeIndex=(activeIndex+step+visibleCards.length)%visibleCards.length; updateModal(); }
    document.querySelector('#close-modal').addEventListener('click', closeModal); document.querySelector('#previous').addEventListener('click', () => move(-1)); document.querySelector('#next').addEventListener('click', () => move(1));
    modal.addEventListener('click', event => { if (event.target === modal) closeModal(); });
    document.addEventListener('keydown', event => { if (!modal.classList.contains('open')) return; if (event.key === 'Escape') closeModal(); if (event.key === 'ArrowLeft') move(-1); if (event.key === 'ArrowRight') move(1); });
    filters.forEach(filter => filter.addEventListener('click', () => { const category=filter.dataset.filter; filters.forEach(item=>item.setAttribute('aria-pressed',item===filter)); let count=0; cards.forEach(card=>{ const matches=category==='all'||card.dataset.category===category; card.classList.toggle('is-hidden',!matches); if(matches) count++; }); document.querySelector('#project-count').textContent=count; document.querySelector('#empty-state').style.display=count?'none':'block'; }));
    refreshIcons();
  </script>
</body>
</html>
